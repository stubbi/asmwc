name: Bug report
description: Report a build, counting, CLI, or compatibility problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For suspected memory corruption or other security findings, use the private security reporting link instead."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Source commit, operating system/distribution, architecture, libc (on Linux), and compiler versions.
      placeholder: "Include git rev-parse HEAD, uname -sm, compiler --version, and rustc --version. On macOS add sw_vers; on Linux add /etc/os-release and getconf GNU_LIBC_VERSION."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducer
      description: Exact build/run commands and a minimal input. Avoid private files or sensitive data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Include stdout, stderr, exit status, and the pinned Rust reference result when relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already run
      description: Include relevant make check or make test output, or explain why they could not run.
